# --------------------------------------------------------
# Plugins (TPM)
# --------------------------------------------------------
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --------------------------------------------------------
# Prefix & Core Settings
# --------------------------------------------------------
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 10000
set -g escape-time 0
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --------------------------------------------------------
# Keybindings
# --------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "✅ Config reloaded!"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind b break-pane -d
bind-key x command-prompt -p "Kill session #S? (y/n)" "if-shell '[ %1 = \"y\" ]' 'kill-session'"
bind w run "tmux list-windows -F '#I:#W' | fzf | cut -d: -f1 | xargs tmux select-window -t"
bind R command-prompt -p "Rename window:" "rename-window '%%'"

# --------------------------------------------------------
# Seamless Vim + tmux navigation (your manual version)
# --------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \ | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\\' if-shell \"$is_vim\" 'send-keys C-\\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --------------------------------------------------------
# Aesthetics & Status Bar
# --------------------------------------------------------
set -g status-position top
set -g status-interval 1
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "

# Colors sourced from HyDE wallbash (auto-generated)
source-file -q ~/.config/tmux/colors-wallbash.conf

# Initialize TPM (must be at the very end)
run '~/.config/tmux/plugins/tpm/tpm'
